<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/favicon-fyag.png" />
        <link rel="apple-touch-icon" href="/favicon-fyag.png">
        <title>FYAG SpA | Control de Bodega y Obras</title>
        <script>
            (function () {
                try {
                    var guardado = localStorage.getItem('fyag_tema');
                    var prefiereOscuro = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    if (guardado === 'dark' || (!guardado && prefiereOscuro)) {
                        document.documentElement.setAttribute('data-theme', 'dark');
                    }
                } catch (e) {}
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
